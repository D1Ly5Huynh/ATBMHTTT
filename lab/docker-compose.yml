services:
  app:
    build: ./app
    image: lab-app
    container_name: xss-lab-app
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  crs-pl1:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: xss-lab-crs-pl1
    depends_on:
      app:
        condition: service_healthy
    environment:
      BACKEND: http://app:3000
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    ports:
      - "127.0.0.1:18080:8080"

  crs-pl2:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: xss-lab-crs-pl2
    depends_on:
      app:
        condition: service_healthy
    environment:
      BACKEND: http://app:3000
      PARANOIA: "2"
      BLOCKING_PARANOIA: "2"
      DETECTION_PARANOIA: "2"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    ports:
      - "127.0.0.1:18081:8080"
